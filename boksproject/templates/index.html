<!DOCTYPE html>
<html>
<head>
    <title>Host Command Runner</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }
        textarea {
            width: 100%;
            height: 100px;
        }
        pre {
            background: #000;
            color: #0f0;
            padding: 15px;
            white-space: pre-wrap;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>

<h2>Run Linux Command</h2>

<form method="POST">
    <label>Enter hostname(s) (comma separated):</label><br><br>
    <textarea name="hostname" placeholder="server1, server2"></textarea><br><br>

    <button type="submit">Run</button>
</form>

<h3>Output:</h3>
<pre>{{ output }}</pre>

</body>
</html>
